<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>FNGRNCTR</title>

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="FNGRNCTR" />
    <meta property="og:description" content="Greetings from Nectarville, USA!" />
    <meta property="og:image" content="https://www.fngrnctr.biz/nectar-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fngrnctr.biz" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FNGRNCTR" />
    <meta name="twitter:description" content="Greetings from Nectarville, USA!" />
    <meta name="twitter:image" content="https://www.fngrnctr.biz/nectar-preview.png" />

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <canvas id="game" aria-label="Top-down movement game" role="img"></canvas>

    <!-- Site landing page (revealed after game) -->
    <div id="site" class="hidden">
        <nav id="site-nav">
            <a href="#" data-section="music" class="nav-link">MUSIC</a>
            <a href="#" data-section="home" class="nav-logo">
                <img src="clouds.png" alt="FNGRNCTR" />
            </a>
            <a href="#" data-section="merch" class="nav-link">MERCH</a>
        </nav>

        <div id="section-home" class="site-section">
            <img src="greetings_from_nectarville_text.png" alt="Greetings from Nectarville" class="home-hero-img" />
        </div>

        <div id="section-music" class="site-section hidden">
            <!-- album grid injected by JS -->
        </div>

        <div id="section-merch" class="site-section hidden">
            <!-- merch grid injected by JS -->
        </div>
    </div>

    <script defer src="main.js"></script>
</body>

</html>
